<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies - Ticket Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-danger fw-bold">Now Showing</h2>
        <div class="row">
            {% for movie in movies %}
            <div class="col-md-3 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ movie.title }}</h5>
                        <p class="text-muted small mb-2">{{ movie.release_date|date:"M d, Y" }} | {{ movie.get_age_certification_display }}</p>
                        <p class="badge bg-success align-self-start">Rating: {{ movie.average_rating }}/5</p>
                        <!-- This link connects the homepage to the detail page -->
                        <a href="{% url 'movie_detail' movie.id %}" class="btn btn-outline-danger mt-auto">View Details</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <p>No movies added yet. Go to the admin panel!</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
